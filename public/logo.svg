<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#6B21A8" />
    </linearGradient>
    <linearGradient id="warmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <rect width="100" height="100" rx="28" fill="url(#purpleGrad)" />
  
  <!-- Heart and Family Connected Hands / Lotus Concept -->
  <g transform="translate(14, 14)">
    <!-- Connected outer heart curve -->
    <path d="M36 62 C36 62, 10 46, 10 26 C10 14, 20 6, 30 10 C34 12, 36 16, 36 16 C36 16, 38 12, 42 10 C52 6, 62 14, 62 26 C62 46, 36 62, 36 62 Z" fill="#FFFFFF" fill-opacity="0.2" />
    
    <!-- Warm Inner Emblem - Family Trio Connected -->
    <!-- Center Parent figure -->
    <circle cx="36" cy="24" r="7" fill="#FFFFFF" />
    <path d="M25 46 C25 36, 47 36, 47 46 Z" fill="#FFFFFF" />
    
    <!-- Left Member (smaller) -->
    <circle cx="18" cy="29" r="5" fill="#FDE68A" />
    <path d="M10 47 C10 39, 26 39, 26 47 Z" fill="#FDE68A" />
    
    <!-- Right Member (child / spouse) -->
    <circle cx="54" cy="29" r="5" fill="#FDE68A" />
    <path d="M46 47 C46 39, 62 39, 62 47 Z" fill="#FDE68A" />

    <!-- Golden heart core -->
    <path d="M36 34 C36 34, 30 28, 30 24 C30 21, 33 19, 36 21 C39 19, 42 21, 42 24 C42 28, 36 34, 36 34 Z" fill="url(#warmGrad)" />
  </g>
</svg>
